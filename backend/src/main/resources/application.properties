spring.application.name=kali-api

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/kali_db}
spring.datasource.username=${DB_USER:kali_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.user=${DB_MIGRATION_USER:kali_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD:}
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

kali.privacy.health-consent-version=${HEALTH_CONSENT_VERSION:2026-01}
kali.security.cookie-secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.name=KALI_SESSION
server.forward-headers-strategy=framework

server.error.include-message=never
